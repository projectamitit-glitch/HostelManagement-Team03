spring.application.name=team3project
server.port=8085

# Development Database Configuration
spring.datasource.url=jdbc:postgresql://team_3_dev_postgres:5432/team_3_db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:team_3_user}
spring.datasource.password=${DB_PASS:team_3_pass}

# JPA / Hibernate settings for Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging for Development
logging.level.org.springframework=INFO
logging.level.com.demo.deutschebank.team2project=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator endpoints for Development
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application specific settings
management.endpoint.health.enabled=true
management.endpoints.web.base-path=/actuator
management.server.port=8085
# Logfile for SBA
management.endpoint.logfile.enabled=true
management.endpoint.logfile.external-file=/logs/log_team3/dev/app.log
# SPRING BOOT ADMIN CLIENT (DEV)
spring.boot.admin.client.url=http://168.220.248.40:9000
spring.boot.admin.client.instance.name=Team3-dev
spring.boot.admin.client.instance.metadata.environment=dev
# IMPORTANT — tells SBA how to reach your Docker container
spring.boot.admin.client.instance.service-base-url=http://168.220.248.40:8090
spring.boot.admin.client.instance.management-base-url=http://168.220.248.40:8090

